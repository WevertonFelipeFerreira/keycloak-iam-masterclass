
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-masterclass
    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
